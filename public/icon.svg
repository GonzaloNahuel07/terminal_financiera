<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141722"/>
      <stop offset="100%" stop-color="#08090c"/>
    </radialGradient>
    <linearGradient id="spiderCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="batmanGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="webCobalt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Fondo redondo oscuro táctico -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#242b38" stroke-width="8"/>

  <!-- Anillo exterior Spider Web & Bat HUD -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="4" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="3"/>

  <!-- Escudo / Silueta Táctica Wayne Bat Wing -->
  <path d="M 140 210 Q 200 240 256 180 Q 312 240 372 210 Q 350 300 256 360 Q 162 300 140 210 Z" fill="#141722" stroke="url(#batmanGold)" stroke-width="6"/>

  <!-- Emblema Central Spider Crimson Diamond -->
  <polygon points="256,170 310,256 256,340 202,256" fill="url(#spiderCrimson)" opacity="0.9"/>

  <!-- Símbolo Moneda / Precisión en Oro Wayne -->
  <text x="256" y="278" font-family="-apple-system, sans-serif" font-size="82" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-2">$</text>

  <!-- Puntos de Coordenadas Tácticas -->
  <circle cx="256" cy="70" r="8" fill="#38bdf8"/>
  <circle cx="256" cy="442" r="8" fill="#f59e0b"/>
  <circle cx="70" cy="256" r="8" fill="#f43f5e"/>
  <circle cx="442" cy="256" r="8" fill="#10b981"/>
</svg>
